
  <!DOCTYPE html>
  <html lang="es">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>MTE - Modulo de Trazabilidad Estrategica</title>
      <style>
        html, body { height: 100%; margin: 0; }
        #root { min-height: 100%; }
        .boot-loader { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f7f8fc; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #222245; }
        .boot-loader__card { min-width: 248px; padding: 28px 32px; box-sizing: border-box; text-align: center; background: #fff; border: 1px solid #e5e7eb; box-shadow: 0 16px 40px rgba(34, 34, 69, .08); }
        .boot-loader__mark { display: flex; justify-content: center; gap: 8px; }
        .boot-loader__mark span { width: 10px; height: 10px; border-radius: 999px; background: #5454e9; animation: boot-pulse 1.1s ease-in-out infinite; }
        .boot-loader__mark span:nth-child(2) { background: #e4eb60; animation-delay: .14s; }
        .boot-loader__mark span:nth-child(3) { background: #4cb979; animation-delay: .28s; }
        .boot-loader p { margin: 18px 0 0; font-size: 14px; font-weight: 800; }
        .boot-loader small { display: block; margin-top: 5px; color: #6b7280; font-size: 12px; font-weight: 600; }
        @keyframes boot-pulse { 0%, 70%, 100% { transform: translateY(0); opacity: .5; } 35% { transform: translateY(-6px); opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { .boot-loader__mark span { animation: none; opacity: 1; } }
      </style>
    </head>

    <body>
      <div id="root">
        <div class="boot-loader" role="status" aria-label="Cargando aplicación" aria-live="polite">
          <div class="boot-loader__card">
            <div class="boot-loader__mark" aria-hidden="true"><span></span><span></span><span></span></div>
            <p>Preparando tu espacio de trabajo</p>
            <small>Cargando aplicación</small>
          </div>
        </div>
      </div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
