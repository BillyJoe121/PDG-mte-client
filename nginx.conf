server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Container health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Built files carry a content hash in their name, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The page always comes fresh so a new deployment is picked up at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Client-side routes (/login, /establecer-contrasena?token_hash=...) are served by the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
