server {
    # Unprivileged port: the container runs nginx as a non-root user.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Container health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Built files carry a content hash in their name, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # The page always comes fresh so a new deployment is picked up at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Client-side routes (/login, /establecer-contrasena?token_hash=...) are served by the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
